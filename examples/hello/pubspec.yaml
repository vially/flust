name: flust_example_hello
description: "The smallest Flust app: one window with a counter."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  # `flutter build flust` and `flutter run -d flust` (tool extension).
  flust_flutter_tools:
    path: ../../packages/flust_flutter_tools

flutter:
  uses-material-design: true
