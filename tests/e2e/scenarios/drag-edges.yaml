# Drag every edge and corner of the window out and back, as a person would,
# with nothing else going on in the app: every frame it draws is one a
# resize asked for.
#
# The top and left edges are the ones that move the window's origin, which
# is where a frame that is late, or anchored to the wrong edge, shows.
# The app is the probe app, built by ../build-app.sh, run from its build
# directory, where the Flutter bundle (data/) and the engine library (lib/)
# sit next to it.
app:
  command: ./flust-e2e-probe
  cwd: ../app/target/debug
  env:
    RUST_LOG: info
    LD_LIBRARY_PATH: lib
    # analyzers/protocol.py reads the protocol trace.
    WAYLAND_DEBUG: "1"

# What the analyzers rely on: a magenta background, and a green border that
# sway draws around the window at the size it has given it.
session:
  output:
    size: 1280x800
    background: "#ff00ff"
  window:
    # The surface, without the border: 640x480 at 100,100 with it.
    size: 624x464
    position: [108, 108]
    border: { width: 8, color: "#00ff00" }

# The analyzers read the frames as images. The pointer would cover the
# corner it drags.
capture:
  frames: true
  cursor: false

steps:
  - wait: stable
  - mark: bottom-right grow
  - drag_resize: { edge: bottom-right, by: [240, 160] }
  - wait: stable
  - mark: bottom-right shrink
  - drag_resize: { edge: bottom-right, by: [-240, -160] }
  - wait: stable
  - mark: bottom grow
  - drag_resize: { edge: bottom, by: [0, 160] }
  - wait: stable
  - mark: bottom shrink
  - drag_resize: { edge: bottom, by: [0, -160] }
  - wait: stable
  - mark: right grow
  - drag_resize: { edge: right, by: [240, 0] }
  - wait: stable
  - mark: right shrink
  - drag_resize: { edge: right, by: [-240, 0] }
  - wait: stable
  - mark: top-left grow
  - drag_resize: { edge: top-left, by: [-90, -90] }
  - wait: stable
  - mark: top-left shrink
  - drag_resize: { edge: top-left, by: [90, 90] }
  - wait: stable
  - mark: top grow
  - drag_resize: { edge: top, by: [0, -90] }
  - wait: stable
  - mark: top shrink
  - drag_resize: { edge: top, by: [0, 90] }
  - wait: stable
  - mark: left grow
  - drag_resize: { edge: left, by: [-90, 0] }
  - wait: stable
  - mark: left shrink
  - drag_resize: { edge: left, by: [90, 0] }
  - wait: stable
  - mark: top-right grow
  - drag_resize: { edge: top-right, by: [240, -90] }
  - wait: stable
  - mark: top-right shrink
  - drag_resize: { edge: top-right, by: [-240, 90] }
  - wait: stable
  - mark: bottom-left grow
  - drag_resize: { edge: bottom-left, by: [-90, 160] }
  - wait: stable
  - mark: bottom-left shrink
  - drag_resize: { edge: bottom-left, by: [90, -160] }
  - wait: stable
  - screenshot: end

analyze:
  - run: python3 ../analyzers/probe_frames.py
  - run: python3 ../analyzers/protocol.py
  - run: python3 ../analyzers/app_log.py
