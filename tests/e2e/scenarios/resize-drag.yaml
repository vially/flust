# Interactive resizes from different edges. Dragging the top/left edges is
# the interesting case for vertical anchoring: the window's top-left moves.
# The app is the template app, run from its build directory, where the
# Flutter bundle (data/) and the engine library (lib/) sit next to it.
app:
  command: ./flust-app-template
  cwd: ../../../flust-app-template/target/debug
  env:
    RUST_LOG: info
    LD_LIBRARY_PATH: lib

# What analyzers/window_fill.py relies on: a magenta background, and a green border
# that sway draws around the window at the size it has given it.
session:
  output:
    size: 1280x800
    background: "#ff00ff"
  window:
    # The surface, without the border: 640x480 at 100,100 with it.
    size: 624x464
    position: [108, 108]
    border: { width: 8, color: "#00ff00" }

# window_fill.py reads the frames as images.
capture:
  frames: true

steps:
  - sleep: 1s
  - mark: drag bottom-right grow
  - drag_resize: { edge: bottom-right, by: [300, 200] }
  - sleep: 500ms
  - mark: drag bottom-right shrink
  - drag_resize: { edge: bottom-right, by: [-300, -200] }
  - sleep: 500ms
  - mark: drag top grow
  - drag_resize: { edge: top, by: [0, -80] }
  - sleep: 500ms
  - mark: drag top shrink
  - drag_resize: { edge: top, by: [0, 80] }
  - sleep: 500ms
  - mark: drag left grow
  - drag_resize: { edge: left, by: [-80, 0] }
  - sleep: 1s

analyze:
  - run: python3 ../analyzers/window_fill.py
