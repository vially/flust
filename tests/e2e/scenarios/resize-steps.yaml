# Discrete resizes, one configure each, with time to settle in between.
# Sizes are the app's surface, without the border.
# The app is the template app, run from its build directory, where the
# Flutter bundle (data/) and the engine library (lib/) sit next to it.
app:
  command: ./flust-app-template
  cwd: ../../../flust-app-template/target/debug
  env:
    RUST_LOG: info
    LD_LIBRARY_PATH: lib

# What analyzers/window_fill.py relies on: a magenta background, and a green border
# that sway draws around the window at the size it has given it.
session:
  output:
    size: 1280x800
    background: "#ff00ff"
  window:
    # The surface, without the border: 640x480 at 100,100 with it.
    size: 624x464
    position: [108, 108]
    border: { width: 8, color: "#00ff00" }

# window_fill.py reads the frames as images.
capture:
  frames: true

steps:
  - sleep: 1s
  - mark: resize to 784x584
  - resize: 784x584
  - sleep: 700ms
  - screenshot: 784x584
  - mark: resize to 484x384
  - resize: 484x384
  - sleep: 700ms
  - screenshot: 484x384
  - mark: resize to 884x284
  - resize: 884x284
  - sleep: 700ms
  - screenshot: 884x284
  - mark: resize to 624x464
  - resize: 624x464
  - sleep: 700ms
  - screenshot: 624x464

analyze:
  - run: python3 ../analyzers/window_fill.py
