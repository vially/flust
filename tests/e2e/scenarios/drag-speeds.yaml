# The same drag at different speeds: from a slow drag, where the app gets a
# new size every few frames, to a flick, where it gets all of them at once.
# The app is the probe app, built by ../build-app.sh, run from its build
# directory, where the Flutter bundle (data/) and the engine library (lib/)
# sit next to it.
app:
  command: ./flust-e2e-probe
  cwd: ../app/build/flust/debug/bundle
  env:
    RUST_LOG: info
    LD_LIBRARY_PATH: lib
    # analyzers/protocol.py reads the protocol trace.
    WAYLAND_DEBUG: "1"

# What the analyzers rely on: a magenta background, and a green border that
# sway draws around the window at the size it has given it.
session:
  output:
    size: 1280x800
    background: "#ff00ff"
  window:
    # The surface, without the border: 640x480 at 100,100 with it.
    size: 624x464
    position: [108, 108]
    border: { width: 8, color: "#00ff00" }

# The analyzers read the frames as images. The pointer would cover the
# corner it drags.
capture:
  frames: true
  cursor: false

steps:
  - wait: stable
  - mark: slow grow
  - drag_resize: { edge: bottom-right, by: [300, 200], duration: 4s, steps: 240 }
  - wait: stable
  - mark: slow shrink
  - drag_resize: { edge: bottom-right, by: [-300, -200], duration: 4s, steps: 240 }
  - wait: stable
  - mark: fast grow
  - drag_resize: { edge: bottom-right, by: [300, 200], duration: 250ms, steps: 15 }
  - wait: stable
  - mark: fast shrink
  - drag_resize: { edge: bottom-right, by: [-300, -200], duration: 250ms, steps: 15 }
  - wait: stable
  - mark: flick grow
  - drag_resize: { edge: bottom-right, by: [300, 200], duration: 50ms, steps: 3 }
  - wait: stable
  - mark: flick shrink
  - drag_resize: { edge: bottom-right, by: [-300, -200], duration: 50ms, steps: 3 }
  - wait: stable
  - mark: back and forth
  - drag_resize: { edge: bottom-right, by: [60, 40], duration: 150ms, steps: 9 }
  - drag_resize: { edge: bottom-right, by: [-60, -40], duration: 150ms, steps: 9 }
  - drag_resize: { edge: bottom-right, by: [60, 40], duration: 150ms, steps: 9 }
  - drag_resize: { edge: bottom-right, by: [-60, -40], duration: 150ms, steps: 9 }
  - wait: stable
  - screenshot: end

analyze:
  - run: python3 ../analyzers/probe_frames.py
  - run: python3 ../analyzers/protocol.py
  - run: python3 ../analyzers/app_log.py
