# What an assistive technology sees of an app with two windows: each is an
# accessible window of its own, named after its title.
#
# This needs a session in which accessibility can be switched on without
# touching the desktop it runs on. `run.py` gives it one, and
# `tests/e2e/README.md` says what that takes. Do not run it without: it
# breaks the accessibility bus of the desktop.
app:
  command: ./flust-e2e-probe
  cwd: ../app/build/flust/debug/bundle
  env:
    RUST_LOG: info
    LD_LIBRARY_PATH: lib
    PROBE_WINDOWS: "1"

session:
  output:
    size: 1280x800

steps:
  - wait: { for: windows, count: 2 }
  - mark: accessibility on
  - exec: >-
      gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus
      --method org.freedesktop.DBus.Properties.Set
      org.a11y.Status IsEnabled "<true>"
  - wait: { for: log, match: "semantics enabled: true" }
  - exec: >-
      python3 ../tools/atspi_tree.py flust-e2e-probe --expect
      "frame:probe 1"
      "frame:probe 2"

analyze:
  - run: python3 ../analyzers/app_log.py
